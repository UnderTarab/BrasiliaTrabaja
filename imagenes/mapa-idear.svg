<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Mapa mental: idear</title><desc id="d">El reto de acercar oportunidades se divide en usuarios, propuesta y criterios de diseño.</desc><rect width="1200" height="680" rx="28" fill="#fffaf0"/><g fill="none" stroke="#aa83c1" stroke-width="8" stroke-linecap="round"><path d="M600 340 C475 340 420 145 280 145"/><path d="M600 340 C450 340 420 270 280 270"/><path d="M600 340 C450 340 420 410 280 410"/><path d="M600 340 C475 340 420 535 280 535"/><path d="M600 340 C740 340 780 340 920 340"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="465" y="280" width="270" height="120" rx="28" fill="#6f4389"/><text x="600" y="330" fill="white" font-size="30" font-weight="700">IDEAR</text><text x="600" y="368" fill="#f8eaff" font-size="19">convertir hallazgos en solución</text><g fill="#ffffff" stroke="#d7c5e2" stroke-width="3"><rect x="60" y="100" width="260" height="90" rx="20"/><rect x="60" y="225" width="260" height="90" rx="20"/><rect x="60" y="365" width="260" height="90" rx="20"/><rect x="60" y="490" width="260" height="90" rx="20"/><rect x="890" y="295" width="260" height="90" rx="20"/></g><g fill="#392b42" font-size="22" font-weight="700"><text x="190" y="140">Definir el reto</text><text x="190" y="170" font-size="17" font-weight="400">reducir dispersión de ofertas</text><text x="190" y="265">Candidatos</text><text x="190" y="295" font-size="17" font-weight="400">buscar · comparar · postularse</text><text x="190" y="405">Empleadores</text><text x="190" y="435" font-size="17" font-weight="400">describir y publicar vacantes</text><text x="190" y="530">Alternativas</text><text x="190" y="560" font-size="17" font-weight="400">mapas · bocetos · storyboard</text><text x="1020" y="330">Diseño útil</text><text x="1020" y="360" font-size="17" font-weight="400">simple · claro · adaptable</text></g></g></svg>