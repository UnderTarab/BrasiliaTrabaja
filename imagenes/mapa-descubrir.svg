<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Mapa mental: descubrir</title><desc id="d">Cinco ramas resumen comunidad, problema, investigación, hallazgos y criterios de diseño.</desc><rect width="1200" height="680" rx="28" fill="#fffaf0"/><g fill="none" stroke="#77a98b" stroke-width="8" stroke-linecap="round"><path d="M600 340 C475 340 420 145 280 145"/><path d="M600 340 C450 340 420 270 280 270"/><path d="M600 340 C450 340 420 410 280 410"/><path d="M600 340 C475 340 420 535 280 535"/><path d="M600 340 C740 340 780 340 920 340"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="465" y="280" width="270" height="120" rx="28" fill="#236b4b"/><text x="600" y="330" fill="white" font-size="30" font-weight="700">DESCUBRIR</text><text x="600" y="368" fill="#e9fff1" font-size="19">entender la necesidad</text><g fill="#ffffff" stroke="#bdd8c6" stroke-width="3"><rect x="60" y="100" width="260" height="90" rx="20"/><rect x="60" y="225" width="260" height="90" rx="20"/><rect x="60" y="365" width="260" height="90" rx="20"/><rect x="60" y="490" width="260" height="90" rx="20"/><rect x="890" y="295" width="260" height="90" rx="20"/></g><g fill="#244238" font-size="22" font-weight="700"><text x="190" y="140">Comunidad</text><text x="190" y="170" font-size="17" font-weight="400">candidatos · empleadores · Bosa</text><text x="190" y="265">Problema</text><text x="190" y="295" font-size="17" font-weight="400">vacantes dispersas</text><text x="190" y="405">Investigación</text><text x="190" y="435" font-size="17" font-weight="400">fuentes · encuestas</text><text x="190" y="530">Hallazgos</text><text x="190" y="560" font-size="17" font-weight="400">percepciones y necesidades</text><text x="1020" y="330">Criterios</text><text x="1020" y="360" font-size="17" font-weight="400">claridad · acceso · confianza</text></g></g></svg>